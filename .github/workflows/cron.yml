# Frequent background jobs. Vercel's Hobby plan only allows once-a-day cron jobs (vercel.json keeps a
# daily run of each as a backstop), so GitHub Actions calls the endpoints on their real schedule:
#   every 5 minutes  → /api/cron/sheets, /api/cron/meta
#   every hour       → /api/cron/followups
# Repository settings → Secrets and variables → Actions:
#   secret   CRON_SECRET  same value as the CRON_SECRET environment variable on Vercel
#   variable APP_URL      the deployment URL, e.g. https://your-app.vercel.app (no trailing slash)
# GitHub may start scheduled runs a few minutes late, and pauses them after 60 days without repository activity.
name: CRM cron

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: crm-cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call cron endpoints
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Set the APP_URL variable and the CRON_SECRET secret in the repository settings."
            exit 0
          fi
          if [ "$SCHEDULE" = "0 * * * *" ]; then paths="followups"
          elif [ -n "$SCHEDULE" ]; then paths="sheets meta"
          else paths="followups sheets meta"; fi
          status=0
          for p in $paths; do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 320 \
              -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/$p") || code=000
            echo "/api/cron/$p → HTTP $code: $(head -c 300 /tmp/out 2>/dev/null)"
            [ "$code" = "200" ] || status=1
          done
          exit $status
