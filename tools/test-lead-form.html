<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead form test</title>
<style>
  :root { --navy: #1D2F3F; --brass: #A9825A; --line: #D8CEC3; --bg: #F4F1EC; --ok: #2F6B3A; --bad: #8E2C2C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font: 15px/1.5 "Segoe UI", Arial, sans-serif; color: #2F2925; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { color: var(--navy); font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #6B5F57; }
  form, .out { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 600; font-size: 13px; color: var(--navy); margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  textarea { min-height: 70px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hp { position: absolute; left: -9999px; }
  button { margin-top: 16px; background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.alt { background: #fff; color: var(--navy); border: 1px solid var(--line); margin-left: 8px; }
  .out { margin-top: 16px; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; }
  .ok { border-left: 4px solid var(--ok); } .bad { border-left: 4px solid var(--bad); }
  small { color: #6B5F57; }
</style>
</head>
<body>
<main>
  <h1>Lead form test</h1>
  <p class="lead">Sends an enquiry to your local CRM exactly like a website form would. Open this file in your browser while <code>npm run dev</code> is running.</p>
  <form id="f">
    <label for="endpoint">CRM endpoint</label>
    <input id="endpoint" value="http://localhost:3000/api/inbound/leads">
    <label for="key">API key of the lead source <small>(shown once when you create the source in Settings → Lead sources)</small></label>
    <input id="key" placeholder="crm_live_…" autocomplete="off" required>
    <div class="row">
      <div><label for="name">Name</label><input id="name" name="name" value="Test Customer"></div>
      <div><label for="phone">Phone</label><input id="phone" name="phone" value="+91 98765 43210"></div>
    </div>
    <label for="email">E-mail</label>
    <input id="email" name="email" value="test.customer@example.com">
    <label for="message">Message</label>
    <textarea id="message" name="message">Interested in a 3 BHK, please call me.</textarea>
    <div class="row">
      <div><label for="utm_source">utm_source</label><input id="utm_source" name="utm_source" value="google"></div>
      <div><label for="utm_campaign">utm_campaign</label><input id="utm_campaign" name="utm_campaign" value="local-test"></div>
    </div>
    <input class="hp" id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Send enquiry</button>
    <button type="button" class="alt" id="bot">Send as a spam bot</button>
    <button type="button" class="alt" id="rnd">New random phone</button>
  </form>
  <div id="out" class="out" hidden></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  async function send(asBot) {
    const out = $('out');
    const body = {};
    for (const f of ['name', 'phone', 'email', 'message', 'utm_source', 'utm_campaign']) body[f] = $(f).value;
    body._gotcha = asBot ? 'https://spam.example' : '';
    out.hidden = false; out.className = 'out'; out.textContent = 'Sending…';
    try {
      const res = await fetch($('endpoint').value.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + $('key').value.trim() },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      out.className = 'out ' + (res.ok ? 'ok' : 'bad');
      out.textContent = 'HTTP ' + res.status + '\n' + JSON.stringify(json, null, 2) +
        (res.ok && json.data && json.data.duplicate ? '\n\nSame phone as an existing lead → a follow-up was added to it instead of a new lead.' : '') +
        (asBot ? '\n\nThe bot got a normal-looking answer, but no lead was created (see the intake log).' : '');
    } catch (e) {
      out.className = 'out bad';
      out.textContent = 'Could not reach the CRM: ' + e.message + '\nIs npm run dev running, and is the endpoint correct?';
    }
  }
  $('f').addEventListener('submit', (e) => { e.preventDefault(); send(false); });
  $('bot').addEventListener('click', () => send(true));
  $('rnd').addEventListener('click', () => { $('phone').value = '+91 9' + String(Math.floor(Math.random() * 1e9)).padStart(9, '0'); });
</script>
</body>
</html>
